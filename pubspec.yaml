name: virtual_gamepad
description: "A highly responsive, reusable virtual gamepad UI package for Flutter. Generates standard 8-byte HID gamepad state arrays from on-screen interactions."
version: 1.0.0
homepage: https://github.com/yourusername/virtual_gamepad
repository: https://github.com/yourusername/virtual_gamepad
issue_tracker: https://github.com/yourusername/virtual_gamepad/issues

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
